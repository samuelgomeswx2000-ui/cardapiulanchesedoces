services:
  - type: web
    name: cardapio-digital
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: cardapio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/cardapio.db
      - key: SESSION_SECRET
        generateValue: true
